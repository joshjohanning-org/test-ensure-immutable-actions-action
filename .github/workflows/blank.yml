name: Check Action Immutability
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check-immutable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Ensure immutable actions
        uses: joshjohanning/ensure-immutable-actions@v1.0.0
        with:
          github-token: ${{ github.token }}
